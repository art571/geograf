<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Географічний тест</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .back-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        padding: 10px 18px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        z-index: 1000;
    }

    .back-btn:hover {
        background-color: #0056b3;
    }

    /* Адаптив */
    @media (max-width: 600px) {
        .back-btn {
            padding: 8px 14px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">← Назад</button>

<script>
function goBack() {
    window.history.back();
}
</script>
<style>
body {
    font-family: Arial;
    background: #f0f8ff;
    padding: 20px;
}
.question {
    margin-bottom: 15px;
    padding: 10px;
    background: white;
    border-radius: 10px;
}
button {
    padding: 10px 20px;
    font-size: 18px;
}
#result {
    font-size: 22px;
    margin-top: 20px;
}
</style>
</head>
<body>

<h1>🌍 Географічний тест (25 загадок)</h1>

<form id="quiz"></form>

<button onclick="check()">Перевірити</button>

<div id="result"></div>

<script>
const questions = [
{
q: "Який океан найбільший?",
a: ["Атлантичний", "Індійський", "Тихий", "Північний Льодовитий"],
correct: 2
},
{
q: "Столиця Франції?",
a: ["Берлін", "Париж", "Рим", "Мадрид"],
correct: 1
},
{
q: "Найдовша річка світу?",
a: ["Амазонка", "Ніл", "Дніпро", "Янцзи"],
correct: 1
},
{
q: "Найбільша пустеля світу?",
a: ["Сахара", "Гобі", "Калахарі", "Атакама"],
correct: 0
},
{
q: "Найвища гора світу?",
a: ["Кіліманджаро", "Еверест", "Альпи", "Говерла"],
correct: 1
},
{
q: "Що таке рельєф?",
a: ["Клімат місцевості", "Сукупність форм поверхні Землі", "Тип ґрунту", "Рослинність"],
correct: 1
},
{
q: "Що таке материк?",
a: ["Велика ділянка суші, оточена водою", "Маленький острів", "Річка", "Гора"],
correct: 0
},
{
q: "Що таке острів?",
a: ["Частина материка", "Суша, оточена водою з усіх сторін", "Півострів", "Гора"],
correct: 1
},
{
q: "Що таке півострів?",
a: ["Суша без води", "Суша, оточена водою з трьох сторін", "Острів", "Річка"],
correct: 1
},
{
q: "Що таке рівнина?",
a: ["Висока гора", "Рівна або слабохвиляста територія", "Ліс", "Річка"],
correct: 1
},
{
q: "Що таке гори?",
a: ["Рівна місцевість", "Високі ділянки земної поверхні", "Річки", "Океани"],
correct: 1
},
{
q: "Що таке клімат?",
a: ["Погода сьогодні", "Багаторічний режим погоди", "Температура води", "Вітер"],
correct: 1
},
{
q: "Що таке атмосфера?",
a: ["Вода", "Оболонка газів навколо Землі", "Ґрунт", "Каміння"],
correct: 1
},
{
q: "Що таке літосфера?",
a: ["Водна оболонка", "Повітря", "Тверда оболонка Землі", "Хмари"],
correct: 2
},
{
q: "Що таке гідросфера?",
a: ["Гори", "Вся вода на Землі", "Повітря", "Ліси"],
correct: 1
},
{
q: "Яка країна найбільша за площею?",
a: ["США", "Китай", "Канада", "Росія"],
correct: 3
},
{
q: "Столиця України?",
a: ["Львів", "Київ", "Харків", "Одеса"],
correct: 1
},
{
q: "Яка річка протікає через Київ?",
a: ["Дунай", "Дніпро", "Дністер", "Буг"],
correct: 1
},
{
q: "Що таке екватор?",
a: ["Лінія поділу Землі на півкулі", "Гора", "Річка", "Клімат"],
correct: 0
},
{
q: "Що таке меридіани?",
a: ["Лінії широти", "Лінії довготи", "Річки", "Гори"],
correct: 1
},
{
q: "Що таке паралелі?",
a: ["Лінії довготи", "Лінії широти", "Гори", "Океани"],
correct: 1
},
{
q: "Який материк найменший?",
a: ["Африка", "Австралія", "Європа", "Антарктида"],
correct: 1
},
{
q: "Що таке вулкан?",
a: ["Гора з виверженням лави", "Річка", "Океан", "Ліс"],
correct: 0
},
{
q: "Що таке землетрус?",
a: ["Дощ", "Рух земної кори", "Вітер", "Сніг"],
correct: 1
},
{
q: "Що таке океан?",
a: ["Маленьке озеро", "Великий водний простір", "Річка", "Гора"],
correct: 1
}
];



const quiz = document.getElementById("quiz");

questions.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "question";

    let html = "<b>" + (index+1) + ". " + item.q + "</b><br>";

    item.a.forEach((option, i) => {
        html += `
        <label>
            <input type="radio" name="q${index}" value="${i}">
            ${option}
        </label><br>`;
    });

    div.innerHTML = html;
    quiz.appendChild(div);
});

function check() {
    let score = 0;

    questions.forEach((item, index) => {
        const ans = document.querySelector(`input[name="q${index}"]:checked`);
        if (ans && Number(ans.value) === item.correct) {
            score++;
        }
    });

    document.getElementById("result").innerText =
        "Твій результат: " + score + " / " + questions.length;
}
</script>

</body>
</html>
