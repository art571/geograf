<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Вгадай місто України</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .back-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        padding: 10px 18px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        z-index: 1000;
    }

    .back-btn:hover {
        background-color: #0056b3;
    }

    /* Адаптив */
    @media (max-width: 600px) {
        .back-btn {
            padding: 8px 14px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">← Назад</button>

<script>
function goBack() {
    window.history.back();
}
</script>
<style>
    body {
        font-family: Arial;
        text-align: center;
        transition: 0.5s;
        background-color: white;
    }

    #container {
        margin-top: 100px;
    }

    input {
        padding: 10px;
        font-size: 18px;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
    }

    #result {
        font-size: 100px;
        display: none;
    }
</style>
</head>
<body>

<div id="container">
    <h2 id="question"></h2>
    <input type="text" id="answer" placeholder="Введи місто">
    <br><br>
    <button onclick="checkAnswer()">Перевірити</button>
</div>

<div id="result"></div>

<script>
const questions = [
    { q: "Столиця України", a: "київ" },
    { q: "Місто біля Чорного моря з портом", a: "одеса" },
    { q: "Культурна столиця заходу України", a: "львів" },
    { q: "Місто з найбільшою АЕС в Україні", a: "енергодар" },
    { q: "Місто з великим металургійним центром", a: "кривий ріг" },
    { q: "Місто на Дніпрі з островом Хортиця", a: "запоріжжя" },
    { q: "Місто шахтарів", a: "донецьк" },
    { q: "Місто біля кордону з Польщею", a: "львів" },
    { q: "Місто з космічною промисловістю", a: "дніпро" },
    { q: "Місто з відомим ринком Барабашово", a: "харків" },
    { q: "Місто з замком Паланок", a: "мукачево" },
    { q: "Місто на півдні біля річки Південний Буг", a: "миколаїв" },
    { q: "Місто з фортецею", a: "кам'янець-подільський" },
    { q: "Місто біля Карпат", a: "івано-франківськ" },
    { q: "Місто з великою кількістю фонтанів", a: "вінниця" },
    { q: "Місто біля румунського кордону", a: "чернівці" },
    { q: "Місто біля білоруського кордону", a: "чернігів" },
    { q: "Місто в центрі України", a: "полтава" },
    { q: "Місто на заході з університетом Франка", a: "львів" },
    { q: "Місто курорт біля моря", a: "одеса" }
];

let current = 0;

function loadQuestion() {
    document.body.style.background = "white";
    document.getElementById("result").style.display = "none";
    document.getElementById("answer").value = "";
    document.getElementById("question").innerText = questions[current].q;
}

function checkAnswer() {
    const userAnswer = document.getElementById("answer").value.toLowerCase().trim();
    const correct = questions[current].a;

    const result = document.getElementById("result");

    if (userAnswer === correct) {
        document.body.style.background = "lightgreen";
        result.innerHTML = "✔";
    } else {
        document.body.style.background = "red";
        result.innerHTML = "❌";
    }

    result.style.display = "block";

    setTimeout(() => {
        current++;
        if (current < questions.length) {
            loadQuestion();
        } else {
            document.getElementById("container").innerHTML = "<h1>Тест завершено 🎉</h1>";
            result.style.display = "none";
            document.body.style.background = "white";
        }
    }, 1500);
}

loadQuestion();
</script>

</body>
</html>
