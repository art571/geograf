
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Пазл — Місця України</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .back-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        padding: 10px 18px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        z-index: 1000;
    }

    .back-btn:hover {
        background-color: #0056b3;
    }

    /* Адаптив */
    @media (max-width: 600px) {
        .back-btn {
            padding: 8px 14px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">← Назад</button>

<script>
function goBack() {
    window.history.back();
}
</script>

<style>
body {
    text-align: center;
    font-family: Arial;
    margin: 10px;
}

h2 {
    font-size: 20px;
}

button {
    padding: 10px 15px;
    font-size: 16px;
    margin: 5px;
}

/* адаптивне поле */
#board {
    margin: 15px auto;
    display: grid;
    width: 90vw;
    max-width: 320px;
    aspect-ratio: 1/1;
}

.cell {
    border: 1px dashed gray;
}

#pieces {
    margin: 10px auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 340px;
}

.piece {
    cursor: pointer;
    border: 1px solid black;
    background-repeat: no-repeat;
}

/* вибраний шматок */
.selected {
    outline: 3px solid red;
}

#info {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
}

</style>

</head>

<body>

<h2>Пазл: Місця України 🇺🇦</h2>

<button id="start">Почати</button>
<button id="check">Перевірити</button>

<div id="board"></div>
<div id="pieces"></div>
<div id="info"></div>

<script>
let size = 3;
let pieceSize = 100;
let currentLevel = 0;
let selectedPiece = null;

// місця
let places = [
    "Карпати — гори на заході України",
    "Озеро Світязь — найглибше озеро України",
    "Кам'янець-Подільська фортеця",
    "Софіївка (Умань)",
    "Києво-Печерська лавра",
    "Хотинська фортеця",
    "Бакота",
    "Острів Хортиця",
    "Тунель кохання",
    "Шацькі озера"
];

$("#start").click(function () {
    currentLevel = 0;
    startLevel();
});

function startLevel() {
    let boardSize = $("#board").width();
    pieceSize = boardSize / size;

    $("#board").css({
        gridTemplateColumns: `repeat(${size}, 1fr)`
    });

    createPuzzle();
}

function createPuzzle() {
    $("#board").empty();
    $("#pieces").empty();
    $("#info").text("");
    selectedPiece = null;

    let pieces = [];

    let boardSize = $("#board").width();
    pieceSize = boardSize / size;

    for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {

            let id = y * size + x;

            $("#board").append(
                `<div class="cell" data-id="${id}"></div>`
            );

            let piece = $(`<div class="piece" data-id="${id}"></div>`);

            piece.css({
                width: pieceSize,
                height: pieceSize,
                backgroundImage: `url('img/${currentLevel}.jpg')`,
                backgroundSize: `${pieceSize * size}px ${pieceSize * size}px`,
                backgroundPosition: `-${x * pieceSize}px -${y * pieceSize}px`
            });

            // КЛІК ПО ШМАТКУ (для телефону)
            piece.click(function () {
                $(".piece").removeClass("selected");
                $(this).addClass("selected");
                selectedPiece = $(this);
            });

            pieces.push(piece);
        }
    }

    pieces.sort(() => Math.random() - 0.5);
    pieces.forEach(p => $("#pieces").append(p));

    // КЛІК ПО КЛІТИНЦІ
    $(".cell").click(function () {
        if (!selectedPiece) return;

        if ($(this).children().length > 0) {
            $("#pieces").append($(this).children());
        }

      $(this).append(selectedPiece);

selectedPiece.css({
    width: "100%",
    height: "100%",
    position: "relative",
    top: 0,
    left: 0
});
    });

    enableDrag(); // залишили і перетягування
}

// drag (для компа)
function enableDrag() {
    $(".piece").draggable({
        revert: "invalid",
        containment: "document",
        stack: ".piece"
    });

    $(".cell").droppable({
        accept: ".piece",
        drop: function (event, ui) {

            if ($(this).children().length > 0) {
                $("#pieces").append($(this).children());
            }

            $(this).append(ui.draggable);

            ui.draggable.css({
                top: 0,
                left: 0,
                position: "relative"
            });
        }
    });
}

// перевірка
$("#check").click(function () {
    let win = true;

    $(".cell").each(function () {
        let cellId = $(this).data("id");
        let pieceId = $(this).children().data("id");

        if (cellId != pieceId) {
            win = false;
        }
    });

    if (win) {
        $("#info").text("✅ " + places[currentLevel]);

        setTimeout(() => {
            currentLevel++;

            if (currentLevel < places.length) {
                createPuzzle();
            } else {
                $("#info").text("🎉 Ти пройшов всі пазли!");
            }

        }, 2000);

    } else {
        alert("❌ Неправильно!");
    }
});
</script>

</body>
</html>
